name: track
# Blizzard publishes the Forever auction snapshots about 20 minutes past the hour. GitHub runs scheduled jobs late or
# skips them (15-18 Nov: about half of the :25/:55 runs never came, 12 hours missed), so in this public repository
# (unlimited minutes) it checks every 10 minutes. A check is one small request against latest.txt; only a new snapshot
# downloads the previous state and scans every house.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: track
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
      BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Anything new?
        id: check
        run: |
          gh release download data --pattern latest.txt --dir . 2>/dev/null || echo "no marker yet"
          python3 track.py --check latest.txt | tee -a "$GITHUB_OUTPUT"

      - name: Previous snapshot
        if: steps.check.outputs.new == 'true'
        run: gh release download data --pattern state.json.gz --dir . || echo "no state yet - this run starts fresh"

      - name: Scan the auction houses
        if: steps.check.outputs.new == 'true'
        run: python3 track.py --state state.json.gz --out out --wait 150

      - name: Upload
        if: steps.check.outputs.new == 'true'
        run: |
          shopt -s nullglob
          files=(out/h-*.json.gz)
          if [ ${#files[@]} -gt 0 ]; then
            for i in 1 2 3; do gh release upload data "${files[@]}" && break; sleep 10; done
            for i in 1 2 3; do gh release upload data state.json.gz --clobber && break; sleep 10; done
          else
            echo "nothing new"
          fi
          if [ -f out/latest.txt ]; then gh release upload data out/latest.txt --clobber; fi

      - name: Drop files older than 30 days (Blizzard API terms)
        if: steps.check.outputs.new == 'true'
        run: |
          id=$(gh api "repos/$GH_REPO/releases/tags/data" --jq .id)
          cutoff=$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh api --paginate "repos/$GH_REPO/releases/$id/assets?per_page=100" \
            --jq ".[] | select((.name | startswith(\"h-\")) and .created_at < \"$cutoff\") | .id" |
          while read -r a; do gh api -X DELETE "repos/$GH_REPO/releases/assets/$a" && echo "deleted asset $a"; done
