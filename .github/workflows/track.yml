name: track
# Blizzard publishes the Forever auction snapshots about 20 minutes past the hour. GitHub starts scheduled runs late,
# sometimes by over half an hour (15 Nov: the :40 run started at :16 the next hour), so it runs twice an hour: at :25
# (waits up to 3 minutes for that hour's snapshot) and at :55 (picks it up if the :25 run was late or skipped; exits at
# once when there is nothing new). About 2 billed minutes an hour, within the free 2,000 a month.
on:
  schedule:
    - cron: "25,55 * * * *"
  workflow_dispatch:

concurrency:
  group: track
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Previous snapshot
        run: gh release download data --pattern state.json.gz --dir . || echo "no state yet - this run starts fresh"

      - name: Scan the auction houses
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        run: python3 track.py --state state.json.gz --out out --wait 180

      - name: Upload
        run: |
          shopt -s nullglob
          files=(out/h-*.json.gz)
          if [ ${#files[@]} -eq 0 ]; then echo "nothing new"; exit 0; fi
          for i in 1 2 3; do gh release upload data "${files[@]}" && break; sleep 10; done
          for i in 1 2 3; do gh release upload data state.json.gz --clobber && break; sleep 10; done

      - name: Drop files older than 30 days (Blizzard API terms)
        run: |
          id=$(gh api "repos/$GH_REPO/releases/tags/data" --jq .id)
          cutoff=$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh api --paginate "repos/$GH_REPO/releases/$id/assets?per_page=100" \
            --jq ".[] | select((.name | startswith(\"h-\")) and .created_at < \"$cutoff\") | .id" |
          while read -r a; do gh api -X DELETE "repos/$GH_REPO/releases/assets/$a" && echo "deleted asset $a"; done
